<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QR Se Print — Super Admin</title><style>body{font-family:Arial;background:#f5f6fa;margin:0;color:#17151d}.wrap{max-width:1200px;margin:auto;padding:25px}.box{background:#fff;padding:20px;border-radius:16px;box-shadow:0 8px 25px #0001;margin-bottom:18px}input,select,button{padding:11px;border:1px solid #ddd;border-radius:9px}button{cursor:pointer;background:#111827;color:#fff}.login{max-width:420px;margin:70px auto}.row{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:center;border-top:1px solid #eee;padding:10px 0;font-size:13px}.head{font-weight:800;border:0}.danger{background:#b91c1c}.ok{color:#047857;font-weight:700}@media(max-width:900px){.row{grid-template-columns:1fr 1fr}.head{display:none}}</style></head><body><div class="wrap"><div id="login" class="box login"><h2>👑 Super Admin</h2><p>All shops, plans, agents and account controls.</p><input id="u" placeholder="Admin username" style="width:100%;box-sizing:border-box;margin:6px 0"><input id="p" type="password" placeholder="Admin password" style="width:100%;box-sizing:border-box;margin:6px 0"><button onclick="login()">Login</button><div id="e"></div></div><div id="app" style="display:none"><div class="box"><h1>👑 QR Se Print Admin</h1><p>Manage registered shops, demo limits, plans, pause status and passwords.</p><button onclick="load()">↻ Refresh</button> <button onclick="logout()">Logout</button></div><div class="box"><h2>Registered Shops</h2><div class="row head"><b>ID</b><b>Name</b><b>Plan</b><b>Status</b><b>Agent</b><b>Password</b><b>Actions</b></div><div id="list"></div></div></div></div><script>let token=localStorage.getItem('qsp_superadmin');async function login(){const username=document.getElementById('u').value.trim();const password=document.getElementById('p').value;const err=document.getElementById('e');err.textContent='';try{const r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username,password})});const d=await r.json();if(!r.ok||!d.success){err.textContent='❌ '+(d.error||'Login failed');return}token=d.token;localStorage.setItem('qsp_superadmin',token);show()}catch(x){console.error(x);err.textContent='❌ Network/server error'}}function show(){document.getElementById('login').style.display='none';document.getElementById('app').style.display='block';load()}async function load(){if(!token){logout();return}const r=await fetch('/api/admin/shops',{headers:{Authorization:'Bearer '+token}});if(r.status===401){logout();return}const d=await r.json();document.getElementById('list').innerHTML=d.shops.map(s=>`<div class="row"><b>${esc(s.id)}</b><span>${esc(s.name||'')}</span><span>${esc(s.plan)}</span><span>${esc(s.plan_status)}${s.paused?' · PAUSED':''}</span><span class="${s.agent_online?'ok':''}">${s.agent_online?'ONLINE':'OFFLINE'}</span><span><button onclick="resetPw('${esc(s.id)}')">Reset</button></span><span><button onclick="setPlan('${esc(s.id)}','demo')">Demo</button> <button onclick="setPlan('${esc(s.id)}','starter')">Starter</button> <button onclick="setPlan('${esc(s.id)}','pro')">Pro</button> <button onclick="setPlan('${esc(s.id)}','premium')">Premium</button></span></div>`).join('')}async function setPlan(id,plan){const r=await fetch('/api/admin/shop/update',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify({shopId:id,plan})});const d=await r.json();alert(d.success?'Plan updated':'❌ '+d.error);load()}async function resetPw(id){const pw=prompt('New password (min 4 chars):');if(!pw)return;const r=await fetch('/api/admin/shop/reset-password',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify({shopId:id,password:pw})});const d=await r.json();alert(d.success?'Password reset: '+d.password:'❌ '+d.error)}function logout(){localStorage.removeItem('qsp_superadmin');location.reload()}function esc(x){return String(x).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}if(token)show()</script></body></html>
