<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QR Se Print - Register</title><script src="https://checkout.razorpay.com/v1/checkout.js"></script><style>body{font-family:Arial;background:#f5f6fa;margin:0}.wrap{max-width:650px;margin:35px auto;padding:20px}.card{background:#fff;padding:25px;border-radius:18px;box-shadow:0 8px 25px #0001}input{width:100%;box-sizing:border-box;padding:12px;margin:7px 0;border:1px solid #ddd;border-radius:10px}button{padding:13px;border:0;border-radius:10px;background:#111827;color:#fff;font-weight:700;cursor:pointer;width:100%;margin-top:10px}.price{font-size:36px;font-weight:900}.err{color:#b91c1c;margin-top:12px}.ok{color:#047857;font-weight:700}</style></head><body><div class="wrap"><div class="card"><h1>🏪 QR Se Print</h1><div id="selected"></div><input id="name" placeholder="Owner name"><input id="shopName" placeholder="Shop name"><input id="phone" maxlength="10" placeholder="Mobile number"><input id="email" type="email" placeholder="Email"><button id="payBtn" onclick="startPayment()">Pay & Create Shop</button><div id="msg"></div></div></div><script>const plan=(new URLSearchParams(location.search).get('plan')||'starter').toLowerCase(),prices={starter:599,pro:899,premium:999};document.getElementById('selected').innerHTML='<b>'+plan.toUpperCase()+'</b><div class="price">₹'+(prices[plan]||599)+'</div><p>Lifetime — pay once, no renewal ever</p>';async function startPayment(){const msg=document.getElementById('msg'),btn=document.getElementById('payBtn');msg.textContent='';btn.disabled=true;try{const p={plan,name:document.getElementById('name').value.trim(),shopName:document.getElementById('shopName').value.trim(),phone:document.getElementById('phone').value.trim(),email:document.getElementById('email').value.trim()};if(!p.name||!p.shopName||p.phone.length<10||!p.email)throw new Error('Please fill all details correctly');const r=await fetch('/api/register/create-order',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(p)}),d=await r.json();if(!d.success)throw new Error(d.error||'Order create failed');const rz=new Razorpay({key:d.keyId,amount:d.amount,currency:'INR',name:'QR Se Print',description:plan.toUpperCase()+' Lifetime Plan',order_id:d.orderId,prefill:{name:p.name,email:p.email,contact:p.phone},handler:async function(resp){const v=await fetch('/api/register/verify-payment',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({registrationId:d.registrationId,razorpay_order_id:resp.razorpay_order_id,razorpay_payment_id:resp.razorpay_payment_id,razorpay_signature:resp.razorpay_signature})}),vd=await v.json();if(!vd.success){msg.className='err';msg.textContent='❌ '+vd.error;btn.disabled=false;return}document.querySelector('.card').innerHTML='<h1>🎉 Registration Successful</h1><p class="ok">Payment verified. Shop activated.</p><p><b>Shop ID</b></p><div class="price">'+vd.shopId+'</div><p><b>Password</b></p><div class="price">'+vd.password+'</div><p>Plan: '+vd.plan.toUpperCase()+'</p><a href="/admin">Open Shop Login</a>'},modal:{ondismiss:function(){btn.disabled=false}}});rz.open()}catch(e){msg.className='err';msg.textContent='❌ '+e.message;btn.disabled=false}}</script></body></html>
