services:
  - type: web
    name: qr-se-print
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: "10000"
      - key: DATA_DIR
        value: "/var/data"
      - key: ADMIN_USER
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
    disk:
      name: qr-se-print-data
      mountPath: /var/data
      sizeGB: 1
