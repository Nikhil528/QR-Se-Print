<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QR Se Print — Print Agent</title><style>
*{box-sizing:border-box}body{margin:0;background:#fff;font-family:Segoe UI,Arial,sans-serif;color:#08285b} .wrap{width:100%;max-width:900px;margin:0 auto;padding:24px 16px 16px}.brand{text-align:center}.logo{width:66px;height:66px;margin:auto;border-radius:20px;background:linear-gradient(135deg,#ff4b8a,#e91e63);display:grid;place-items:center;color:#fff;font-size:30px;font-weight:900;box-shadow:0 10px 24px #e91e6340}.brand h1{margin:9px 0 3px;font-size:28px;color:#001b43}.status{font-size:16px}.dot{display:inline-block;width:11px;height:11px;border-radius:50%;background:#f39c12;margin-right:7px}.card{margin-top:14px;border:1px solid #e5e9f2;border-radius:16px;overflow:hidden;box-shadow:0 7px 20px #102a5b12}.row{height:57px;display:flex;align-items:center;border-bottom:1px solid #e8edf5;padding:0 18px;font-size:16px}.row:last-child{border-bottom:0}.icon{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;margin-right:14px;background:#fce5ee;color:#e91e63;font-weight:700}.val{margin-left:auto;font-weight:700;color:#071b3d}.ok{padding:7px 15px;border-radius:18px;background:#d9f8e6;color:#0a9d48}.no{background:#ffe0e3;color:#bd1820}.printer{margin-top:14px;padding:14px 18px;border:1px solid #ffcbd9;border-radius:16px;background:#fff2f5}.phead{font-weight:800;font-size:17px;margin-bottom:10px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.label{font-size:13px;font-weight:800;margin-bottom:5px}.select{width:100%;height:42px;border:1px solid #f1b8ca;border-radius:10px;padding:0 10px;background:#fff;font-size:14px;color:#08285b}.buttons{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:12px}.btn{border:0;border-radius:12px;height:50px;color:white;font-size:15px;font-weight:800;cursor:pointer;box-shadow:0 8px 18px #00000015}.pink{background:#e71964}.green{background:#13a34a}.blue{background:#4036cf}.orange{background:#f39a00}.wide{grid-column:1/-1}.notice{text-align:center;margin-top:9px;font-size:13px;color:#c45d00}.footer{text-align:center;color:#93a2b9;font-size:12px;margin-top:10px}.jobs{margin-top:14px}.job{padding:13px 15px;border:1px solid #e5e9f2;border-radius:12px;margin-bottom:8px}.small{font-size:12px;color:#74839b}.danger{color:#c51620}.success{color:#078b3d}@media(max-width:650px){.grid,.buttons{grid-template-columns:1fr}.buttons .wide{grid-column:auto}}
</style></head><body><div class="wrap"><div class="brand"><div class="logo">▦</div><h1>QR Se Print</h1><div class="status"><span id="dot" class="dot"></span><span id="status">Connecting...</span></div></div><div class="card"><div class="row"><div class="icon">⌂</div>Shop Name <span class="val" id="shopName">—</span></div><div class="row"><div class="icon">▣</div>Shop ID <span class="val" id="shopId">—</span></div><div class="row"><div class="icon">V</div>Version <span class="val" id="version">—</span></div><div class="row"><div class="icon">⌁</div>Connected to Server <span class="val" id="server">...</span></div><div class="row"><div class="icon">◷</div>Last Sync <span class="val" id="sync">—</span></div></div><div class="printer"><div class="phead">▤ &nbsp; Select Printer</div><div class="grid"><div><div class="label">Black & White Printer</div><select id="bw" class="select"></select></div><div><div class="label">Color Printer</div><select id="color" class="select"></select></div><div><div class="label">4×6 Photo Printer</div><select id="p4" class="select"></select></div><div><div class="label">A3 Printer</div><select id="a3" class="select"></select></div><div><div class="label">Duplex Printer</div><select id="dup" class="select"></select></div></div></div><div class="buttons"><button class="btn pink" onclick="save()">▣ &nbsp; Save Printer</button><button class="btn green" onclick="sync()">⟳ &nbsp; Sync Now</button><button class="btn blue" onclick="refresh()">⟳ &nbsp; Refresh Printer List</button><button id="demo" class="btn orange wide" style="display:none" onclick="plan()">⚡ &nbsp; Demo se Paid Shop par jao</button></div><div id="notice" class="notice"></div><div class="jobs"><div class="phead">Recent Activity</div><div id="jobs"></div></div><div class="footer">© QR Se Print — Print Agent</div></div><script>
async function api(p,o){let r=await fetch(p,o);return r.json()}function opt(el,arr,sel){el.innerHTML='<option value="">— Windows ka default printer —</option>'+arr.map(x=>'<option>'+esc(x.name||x)+'</option>').join('');if(sel)el.value=sel}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function refresh(){let d=await api('/state');opt(bw,d.printers,d.config.PrinterBW);opt(color,d.printers,d.config.PrinterColor);opt(p4,d.printers,d.config.Printer4x6);opt(a3,d.printers,d.config.PrinterA3);opt(dup,d.printers,d.config.PrinterDuplex);document.getElementById('status').textContent=d.connected?'Print Agent Online':'Print Agent Offline';document.getElementById('dot').style.background=d.connected?'#10a84a':'#e53935';shopName.textContent=d.shopName||d.config.ShopID;shopId.textContent=d.config.ShopID;version.textContent='v'+d.config.Version;server.textContent=d.connected?'Yes':'No';sync.textContent=d.lastSync||'—';if(d.demo){demo.style.display='block';notice.textContent=d.demoMessage||'Aap DEMO Shop ID use kar rahe hain.'}else{demo.style.display='none';notice.textContent=''}jobs.innerHTML=(d.jobs||[]).slice(0,6).map(j=>'<div class="job"><b>'+esc(j.id)+'</b> — '+esc(j.file||'')+'<div class="small '+(j.ok?'success':'')+'">'+esc(j.status||'')+'</div></div>').join('')}async function save(){await api('/save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({bw:bw.value,color:color.value,p4:p4.value,a3:a3.value,dup:dup.value})});await refresh()}async function sync(){await api('/sync',{method:'POST'});await refresh()}function plan(){window.open('https://bvv-djql.onrender.com/','_blank')}refresh();setInterval(refresh,5000)</script></body></html>
